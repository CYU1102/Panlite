name: Build macOS release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --config electron-builder.mac.yml

      - name: Verify and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          asset="$(find release-macos -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$asset"
          asset_name="$(basename "$asset")"
          (cd release-macos && shasum -a 256 "$asset_name" > "$asset_name.sha256")
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --clobber --repo "$GITHUB_REPOSITORY"
