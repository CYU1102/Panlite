name: Build macOS review assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to validate
        required: true

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm run security:audit

      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --config electron-builder.mac.yml --publish never

      - name: Verify DMG checksum
        run: |
          asset="$(find release-macos -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$asset"
          asset_name="$(basename "$asset")"
          (cd release-macos && shasum -a 256 "$asset_name" > "$asset_name.sha256")
          (cd release-macos && shasum -a 256 -c "$asset_name.sha256")

      - name: Save unsigned DMG for review
        uses: actions/upload-artifact@v5
        with:
          name: PanLite-mac-${{ matrix.arch }}
          path: |
            release-macos/*.dmg
            release-macos/*.sha256
